name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Fixtures only. CI must never receive production database or Stripe keys.
      VITE_SUPABASE_URL: https://fixture.invalid
      VITE_SUPABASE_ANON_KEY: fixture-anon-key
      SUPABASE_URL: https://fixture.invalid
      SUPABASE_SERVICE_ROLE_KEY: fixture-service-key
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm ci --prefix server
      - run: npm run check
      - run: npm run check:edge
      - run: npm audit --audit-level=moderate
      - run: npm audit --prefix server --audit-level=moderate
