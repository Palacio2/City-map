name: Clean database restore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # Deliberately no production secrets, db link or migration repair.
      - name: Restore all migrations into disposable local Supabase
        run: npm exec --yes --package=supabase@2.113.0 -- node scripts/check-clean-db.mjs
